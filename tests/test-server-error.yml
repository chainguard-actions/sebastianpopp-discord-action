name: Test webhook returning an HTTP error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local webhook receiver that returns 500
        run: |
          rm -f /tmp/error-req.json /tmp/error-req.json.ready
          nohup node "$GITHUB_WORKSPACE/tests/fixtures/webhook-server.js" 8789 /tmp/error-req.json 500 > /tmp/error-server.log 2>&1 &
          for i in $(seq 1 50); do
            [ -f /tmp/error-req.json.ready ] && break
            sleep 0.2
          done
          if [ ! -f /tmp/error-req.json.ready ]; then
            echo "FAIL: server did not start"; cat /tmp/error-server.log; exit 1
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook: http://127.0.0.1:8789/api/webhooks/789/bad
          message: should fail
      - name: Assert request was attempted and the step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ ! -f /tmp/error-req.json ]; then
            echo "FAIL: no request received"; exit 1
          fi
          cat /tmp/error-req.json; echo
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected the action to fail on HTTP 500"
            exit 1
          fi
          echo "PASS"
