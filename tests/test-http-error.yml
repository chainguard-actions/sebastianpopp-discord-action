name: Test webhook returns HTTP error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Start local webhook receiver returning 400
        run: |
          rm -rf /tmp/webhook-err
          setsid nohup node "$GITHUB_WORKSPACE/tests/fixtures/webhook-server.js" 18783 400 /tmp/webhook-err > /tmp/webhook-err.log 2>&1 &
          for i in $(seq 1 50); do
            [ -f /tmp/webhook-err/ready ] && break
            sleep 0.2
          done
          if [ ! -f /tmp/webhook-err/ready ]; then
            echo "FAIL: webhook receiver did not start"; cat /tmp/webhook-err.log; exit 1
          fi
      - id: action
        uses: .
        continue-on-error: true
        with:
          webhook: http://127.0.0.1:18783/hook
          message: this should fail
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          [ -f /tmp/webhook-err/body ] || { echo "FAIL: request never reached receiver"; exit 1; }
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure on HTTP 400"
            exit 1
          fi
          echo "PASS"
